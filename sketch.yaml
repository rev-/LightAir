profiles:
  ESP32-S3-WROOM-1-N8R8:
    fqbn: esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none,PSRAM=opi,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
    platforms:
      - platform: esp32:esp32 (2.0.17)
    libraries:
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.2)
      - FastLED (3.10.3)
      - ArduinoLog (1.1.1)
      - AUnit (1.7.1)
    programmer: esptool
  # The projectors in the field: 8 MB flash like N8R8, but NO PSRAM.
  # Same flash layout, one changed option — and that option reaches the
  # firmware, not just the build.  The Lua allocator asks PSRAM first and
  # falls back to internal RAM without a word, so here a ruleset and its
  # libraries (~50 KB of prototypes and tables, reported by the load log)
  # come out of the same pool as the radio, the display and the stacks.
  # Game sources are streamed into the parser rather than buffered whole
  # for exactly this reason, and GameDefaults::MAX_GAMES is sized for
  # this board rather than for the roomy one; keep both that way.
  ESP32-S3-WROOM-1-N8:
    fqbn: esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
    platforms:
      - platform: esp32:esp32 (2.0.17)
    libraries:
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.2)
      - FastLED (3.10.3)
      - ArduinoLog (1.1.1)
      - AUnit (1.7.1)
    programmer: esptool

  ESP32-S3-WROOM-1-WOKWI:
    notes: targets wowki esp32 s3 simulator.
    fqbn: esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
    platforms:
      - platform: esp32:esp32 (2.0.17)
    libraries:
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.2)
      - FastLED (3.10.3)
      - ArduinoLog (1.1.1)
      - AUnit (1.7.1)
    programmer: esptool
default_profile: ESP32-S3-WROOM-1-N8R8
